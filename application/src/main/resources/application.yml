spring:
  application:
    name: econference-backend

  # Default profile uses H2 for quick local dev without Docker
  datasource:
    url: jdbc:h2:mem:econference;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: "${MAIL_HOST:mail.econferences.com.br}"
    port: "${MAIL_PORT:465}"
    username: "${MAIL_USERNAME:suporte@econferences.com.br}"
    password: "${MAIL_PASSWORD:UIN665_MRXNd^[=u}"
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false

server:
  port: 8080

app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@econference.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
      first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
      last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Econference}
      phone: ${BOOTSTRAP_ADMIN_PHONE:}
  cors:
    allowed-origins: "http://localhost:4200"
  jwt:
    secret: "${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LTI1Ni1iaXQtc2VjcmV0LWtleS1kb250LXVzZS1pbi1wcm9k}"
    expiration-days: 7
  email:
    from: "suporte@econferences.com.br"
    verification-expiry-hours: 24
    reset-token-expiry-hours: 1
    base-url: "http://localhost:4200"
  invitation:
    stub-mode: true
  event-request:
    tracking-code-prefix: "SOL"
    activation-expiry-hours: 168
    activation-path: "/event-request/activate"
    notifications-enabled: true

logging:
  level:
    com.econference: DEBUG
    org.springframework.modulith: INFO

---
# PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/econference
    username: econference
    password: econference
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
