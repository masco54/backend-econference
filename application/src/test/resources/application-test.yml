spring:
  datasource:
    url: jdbc:h2:mem:econference-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.ssl.enable: false

app:
  bootstrap:
    admin:
      enabled: true
      email: "admin@econference.local"
      password: "Admin@123"
      first-name: "Admin"
      last-name: "Econference"
      phone: ""
  jwt:
    secret: "dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMjU2LWJpdHMtbG9uZy1lbm91Z2g="
    expiration-days: 1
  email:
    from: "test@econference.test"
    verification-expiry-hours: 24
    reset-token-expiry-hours: 1
    base-url: "http://localhost:3000"
  invitation:
    stub-mode: true
  cors:
    allowed-origins: "http://localhost:3000"
  event-request:
    tracking-code-prefix: "SOL"
    activation-expiry-hours: 24
    activation-path: "/event-request/activate"
    notifications-enabled: false
